<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Aula 13: Tabela</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: black;
        }

        table {
            margin: 30px;
            width: 40em;
            height: 20em;
            border-collapse: collapse;
        }

        caption {
            background-color: #ddd;
            font-weight: 600;
            border-radius: 5px;
            padding: 5px;
        }

        td {
            text-align: center;
            vertical-align: middle;
            border: 1px solid black;
            transition: transform 0.2s ease-in-out;
        }

        td:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <table>
        <caption>
            Desafio da Aula 13: Tabela
        </caption>
        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td rowspan="2">3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
                <td>7</td>
            </tr>
            <tr>
                <td colspan="3">8</td>
                <td>9</td>
                
            </tr>
            <tr>
                <td rowspan="2">10</td>
                <td colspan="2">11</td>
                <td>12</td>
            </tr>
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>
    <script>
        document.querySelectorAll('td').forEach(td => {
            td.addEventListener('click', () => {
                const matiz = Math.floor(Math.random() * 360);
                td.style.backgroundColor = `hsl(${matiz}, 75%, 65%)`;
            });
        });
    </script>
</body>
</html>
